[project]
name = "urbanheat-analytics"
version = "0.1.0"
description = "A research dashboard for documented urban heat observations"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "plotly>=5.24,<8.0",
    "streamlit>=1.40,<2.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
